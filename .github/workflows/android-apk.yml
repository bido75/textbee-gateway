name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - integrations/textbee/android/**
      - .github/workflows/android-apk.yml
  push:
    branches: [main]
    paths:
      - integrations/textbee/android/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/textbee/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Firebase Android configuration
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.TEXTBEE_ANDROID_GOOGLE_SERVICES_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_B64"
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > app/src/dev/google-services.json
      - name: Build self-hosted APK
        env:
          TEXTBEE_ANDROID_API_BASE_URL: https://textbee-api.giscop.com/api/v1/
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDevRelease
          cp app/build/outputs/apk/dev/release/app-dev-release.apk textbee-giscop-latest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: textbee-giscop-apk
          path: integrations/textbee/android/textbee-giscop-latest.apk
          if-no-files-found: error
      - name: Publish rolling APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Self-hosted Android APK
          prerelease: true
          make_latest: false
          body: Built automatically from the latest main branch for https://textbee-api.giscop.com/api/v1/.
          files: integrations/textbee/android/textbee-giscop-latest.apk

