#!KAMAILIO
#
# Minimal Kamailio config: acts as the SIP edge in front of Asterisk.
#  - Registers your wholesale carrier's SIP trunk (or accepts its inbound INVITEs)
#  - Relays everything to Asterisk on 127.0.0.1:5060 for call logic
#  - Handles NAT traversal so remote SIP endpoints work cleanly
#
# Replace ASTERISK_IP / trunk details with your real values before deploying.

#!define WITH_NAT
#!define ASTERISK_IP "127.0.0.1"
#!define ASTERISK_PORT "5060"

log_stderror = yes
log_facility = LOG_LOCAL0
children = 4

listen = udp:0.0.0.0:5060
listen = tcp:0.0.0.0:5060

# ---- modules ----
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"

modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
modparam("usrloc", "db_mode", 0)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        # in-dialog request: just relay
        if (loose_route()) {
            route(RELAY);
            exit;
        }
    }

    # NAT handling
    force_rport();
    if (nat_uac_test("19")) {
        fix_nated_contact();
    }

    if (is_method("REGISTER")) {
        # Wholesale trunk / SIP phone registration
        save("location");
        exit;
    }

    if (is_method("INVITE")) {
        # Bridge media through rtpengine, then send everything to Asterisk
        rtpengine_manage("replace-origin replace-session-connection");
        $du = "sip:" + ASTERISK_IP + ":" + ASTERISK_PORT;
        route(RELAY);
        exit;
    }

    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
