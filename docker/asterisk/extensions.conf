[from-trunk]
; Inbound PSTN call arrives here from the wholesale carrier via Kamailio.
; Hand it straight to the ARI "ai-gateway" Stasis app so the AI agent's
; MCP adapter (AsteriskAriAdapter) sees it as a "call.incoming" event.
exten => _X.,1,NoOp(Inbound PSTN call from ${CALLERID(num)})
 same => n,Stasis(ai-gateway)
 same => n,Hangup()

[from-ai-agent]
; Outbound calls originated by the AI gateway (via ARI /channels POST) land
; here before being bridged to the trunk.
exten => _X.,1,NoOp(Outbound call to ${EXTEN} via AI gateway)
 same => n,Dial(PJSIP/${EXTEN}@sip-trunk-1,30)
 same => n,Hangup()

[default]
exten => _X.,1,NoOp(Unmatched call)
 same => n,Hangup()

[from-mobile]
; Inbound cellular call arriving via chan_mobile (someone called the SIM's
; real number). Hand it to the AsteriskChanMobileProvider's own ARI Stasis
; app — a DIFFERENT app name from the SIP-trunk adapter's, so the two
; providers' events don't collide even though they share one Asterisk box.
exten => _X.,1,NoOp(Inbound cellular call via chan_mobile from ${CALLERID(num)})
 same => n,Stasis(ai-gateway-mobile)
 same => n,Hangup()
