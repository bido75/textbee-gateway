; Sample chan_mobile config for the AsteriskChanMobileProvider reference
; prototype (see src/cellular/asterisk-chan-mobile-provider.ts for the full
; list of honest limitations — untested against live hardware, community-
; maintained module, Bluetooth range/adapter-count constraints, etc).
;
; PREREQUISITES (not covered by this file alone):
;   - A working Bluetooth adapter + BlueZ stack on the Asterisk host.
;   - The Android phone paired via Bluetooth (Settings -> Bluetooth -> pair),
;     with Hands-Free Profile (HFP) permissions granted.
;   - `chan_mobile.so` loaded (modules.conf: load => chan_mobile.so).
;   - Per Asterisk's docs, each simultaneously-connected phone generally
;     needs its own Bluetooth adapter on the server.

[general]
interval=30          ; seconds between checking/reconnecting known devices

[mobile0]
address=AA:BB:CC:DD:EE:FF   ; the Android phone's Bluetooth MAC address
port=1                       ; RFCOMM port (often 1 for HFP; run `sdptool browse` on the paired device if unsure)
context=from-mobile          ; dialplan context for inbound calls from this phone
group=0
adapter=hci0                 ; which local Bluetooth adapter to use for this device
