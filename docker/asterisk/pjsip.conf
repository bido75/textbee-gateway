; Minimal PJSIP config for the self-hosted PBX core.
;
; "sip-trunk-1" below is the wholesale SIP trunk your carrier (VoIP.ms,
; Telnyx, BulkVS, Flowroute, ...) gives you. Replace host/username/password
; with the values from your carrier's portal. This is the ONE paid piece of
; the whole stack — everything else here is free.

[global]
type=global
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;
; ---- Wholesale SIP trunk (outbound + inbound PSTN) ----
;
[sip-trunk-1]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw,g722
outbound_auth=sip-trunk-1-auth
aors=sip-trunk-1-aor
identify_by=username

[sip-trunk-1-auth]
type=auth
auth_type=userpass
username=YOUR_TRUNK_USERNAME
password=YOUR_TRUNK_PASSWORD

[sip-trunk-1-aor]
type=aor
contact=sip:YOUR_CARRIER_SIP_HOST:5060

[sip-trunk-1-identify]
type=identify
endpoint=sip-trunk-1
match=YOUR_CARRIER_SIP_HOST

;
; ---- Local endpoint the AI gateway/Kamailio use to reach Asterisk ----
;
[ai-gateway]
type=endpoint
context=from-ai-agent
disallow=all
allow=ulaw,alaw,g722
aors=ai-gateway-aor

[ai-gateway-aor]
type=aor
max_contacts=5
